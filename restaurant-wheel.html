<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Wheel</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --accent: #e94560;
    --text: #eaeaea;
    --muted: #8b8b9e;
    --good: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  h1 { margin: 0 0 16px; font-size: 24px; }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 800px) {
    body { padding: 10px; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    .layout {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .restaurant-list { max-height: 260px; }
    .wheel-container { width: 95vw; height: 95vw; }
    .result { font-size: 18px; }
  }
  .panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type="text"] {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #2a3a5e;
    background: #0f1626;
    color: var(--text);
    font-size: 14px;
  }
  input[type="range"] { width: 100%; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { margin-bottom: 14px; }
  .distance-value { color: var(--accent); font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 16px 0 8px;
  }
  .results-header h3 { margin: 0; font-size: 15px; }
  .small-btn {
    background: transparent;
    border: 1px solid #2a3a5e;
    color: var(--muted);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 400;
  }
  .restaurant-list {
    max-height: 360px;
    overflow-y: auto;
    border: 1px solid #2a3a5e;
    border-radius: 6px;
  }
  .restaurant-item {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid #2a3a5e;
    cursor: pointer;
    user-select: none;
    font-size: 14px;
  }
  .restaurant-item:last-child { border-bottom: none; }
  .restaurant-item:hover { background: #1f2d4d; }
  .restaurant-item.hidden-r { opacity: 0.35; text-decoration: line-through; }
  .restaurant-item .name { flex: 1; }
  .restaurant-item .meta { color: var(--muted); font-size: 11px; margin-left: 8px; }
  .restaurant-item .weblink {
    color: #6cb9ff;
    font-size: 11px;
    margin-left: 8px;
    text-decoration: none;
    border-bottom: 1px dotted #6cb9ff;
  }
  .restaurant-item .weblink:hover { color: #a3d2ff; }
  .restaurant-item.hidden-r .weblink { color: var(--muted); border-bottom-color: var(--muted); }
  .restaurant-item .maplink {
    color: #6ce0a4;
    font-size: 11px;
    margin-left: 8px;
    text-decoration: none;
    border-bottom: 1px dotted #6ce0a4;
  }
  .restaurant-item .maplink:hover { color: #9ff0c1; }
  .restaurant-item.hidden-r .maplink { color: var(--muted); border-bottom-color: var(--muted); }
  .wheel-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .wheel-container {
    position: relative;
    width: 500px;
    height: 500px;
    max-width: 95vw;
    max-height: 95vw;
  }
  canvas#wheel { width: 100%; height: 100%; }
  .confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }
  .pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 24px solid var(--accent);
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }
  .result {
    font-size: 22px;
    font-weight: 700;
    color: var(--good);
    min-height: 30px;
    text-align: center;
  }
  .count-badge {
    background: #2a3a5e;
    color: var(--text);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    margin-left: 6px;
  }
  .search-wrap { position: relative; }
  .suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #0f1626;
    border: 1px solid #2a3a5e;
    border-radius: 6px;
    margin-top: 2px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  .suggestions.open { display: block; }
  .suggestion {
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid #1a2440;
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover, .suggestion.active { background: #1f2d4d; }
  .coords-info {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-family: ui-monospace, Consolas, monospace;
    min-height: 14px;
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="panel">
      <h1>Restaurant Wheel</h1>

      <div class="row">
        <label>Location</label>
        <div class="search-wrap">
          <input id="address" type="text" placeholder="Search address, e.g. 3600 san jeronimo" autocomplete="off">
          <div class="suggestions" id="suggestions"></div>
        </div>
        <button class="small-btn" id="geo-btn" style="margin-top: 6px;">Use my location</button>
        <div class="coords-info" id="coords-info"></div>
      </div>

      <div class="row">
        <label>Distance: <span class="distance-value" id="dist-label">2.0</span> miles</label>
        <input id="dist" type="range" min="0.5" max="10" step="0.5" value="2">
      </div>

      <div class="row">
        <button id="search-btn">Find restaurants</button>
        <button id="spin-btn" disabled style="margin-left: 8px;">Spin!</button>
      </div>

      <div class="status" id="status"></div>

      <div class="results-header">
        <h3>Restaurants <span class="count-badge" id="count">0</span></h3>
        <div>
          <button class="small-btn" id="hide-all-btn">Hide all</button>
          <button class="small-btn" id="reset-btn">Reset hidden</button>
        </div>
      </div>
      <div class="restaurant-list" id="list"></div>
    </div>

    <div class="panel wheel-wrap">
      <div class="result" id="result">Spin to pick!</div>
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
        <canvas id="confetti" class="confetti-canvas"></canvas>
      </div>
    </div>
  </div>

<script>
  const els = {
    address: document.getElementById('address'),
    suggestions: document.getElementById('suggestions'),
    coordsInfo: document.getElementById('coords-info'),
    geoBtn: document.getElementById('geo-btn'),
    dist: document.getElementById('dist'),
    distLabel: document.getElementById('dist-label'),
    searchBtn: document.getElementById('search-btn'),
    spinBtn: document.getElementById('spin-btn'),
    status: document.getElementById('status'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    resetBtn: document.getElementById('reset-btn'),
    hideAllBtn: document.getElementById('hide-all-btn'),
    result: document.getElementById('result'),
    canvas: document.getElementById('wheel'),
  };

  let restaurants = [];      // [{name, id, hidden}]
  let userLocation = null;   // {lat, lon}
  let spinAngle = 0;
  let spinning = false;

  const HIDDEN_KEY = 'restaurantWheel.hidden';
  function loadHidden() {
    try { return new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]')); }
    catch { return new Set(); }
  }
  function saveHidden() {
    const hidden = restaurants.filter(r => r.hidden).map(r => r.name);
    // Merge with previously hidden names not in current results, so they persist across searches
    const prev = loadHidden();
    hidden.forEach(n => prev.add(n));
    restaurants.filter(r => !r.hidden).forEach(r => prev.delete(r.name));
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...prev]));
  }

  els.dist.addEventListener('input', () => {
    els.distLabel.textContent = parseFloat(els.dist.value).toFixed(1);
  });

  els.geoBtn.addEventListener('click', useGeolocation);
  els.searchBtn.addEventListener('click', search);
  els.spinBtn.addEventListener('click', spin);
  els.resetBtn.addEventListener('click', () => {
    restaurants.forEach(r => r.hidden = false);
    localStorage.removeItem(HIDDEN_KEY);
    renderList();
    drawWheel();
    els.spinBtn.disabled = restaurants.length === 0;
  });

  els.hideAllBtn.addEventListener('click', () => {
    if (!restaurants.length) return;
    restaurants.forEach(r => r.hidden = true);
    saveHidden();
    renderList();
    drawWheel();
    els.spinBtn.disabled = true;
  });

  function setStatus(msg, isError) {
    els.status.textContent = msg;
    els.status.style.color = isError ? 'var(--accent)' : 'var(--muted)';
  }

  function setCoordsInfo() {
    if (userLocation) {
      els.coordsInfo.textContent = `📍 ${userLocation.lat.toFixed(5)}, ${userLocation.lon.toFixed(5)}`;
    } else {
      els.coordsInfo.textContent = '';
    }
  }

  function useGeolocation() {
    setStatus('Getting your location...');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        setCoordsInfo();
        setStatus('Location set. Click "Find restaurants".');
      },
      (err) => {
        setStatus('Could not get location: ' + err.message + '. Type an address instead.', true);
      }
    );
  }

  // Live address search via Nominatim, biased toward user location
  let searchDebounce = null;
  let activeSuggestionIdx = -1;
  let lastSuggestions = [];

  els.address.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const q = els.address.value.trim();
    if (q.length < 3) {
      hideSuggestions();
      return;
    }
    searchDebounce = setTimeout(() => fetchSuggestions(q), 300);
  });

  els.address.addEventListener('keydown', (e) => {
    if (!els.suggestions.classList.contains('open')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeSuggestionIdx = Math.min(activeSuggestionIdx + 1, lastSuggestions.length - 1);
      renderSuggestions();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeSuggestionIdx = Math.max(activeSuggestionIdx - 1, 0);
      renderSuggestions();
    } else if (e.key === 'Enter') {
      if (activeSuggestionIdx >= 0) {
        e.preventDefault();
        pickSuggestion(lastSuggestions[activeSuggestionIdx]);
      }
    } else if (e.key === 'Escape') {
      hideSuggestions();
    }
  });

  document.addEventListener('click', (e) => {
    if (!els.address.contains(e.target) && !els.suggestions.contains(e.target)) {
      hideSuggestions();
    }
  });

  async function fetchSuggestions(q) {
    let url = `https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&q=${encodeURIComponent(q)}`;
    // Bias to a ~50mi box around current location
    if (userLocation) {
      const d = 0.7; // ~50mi in degrees
      const left = userLocation.lon - d;
      const right = userLocation.lon + d;
      const top = userLocation.lat + d;
      const bottom = userLocation.lat - d;
      url += `&viewbox=${left},${top},${right},${bottom}&bounded=0`;
    }
    try {
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const data = await res.json();
      lastSuggestions = data;
      activeSuggestionIdx = -1;
      renderSuggestions();
    } catch (e) {
      hideSuggestions();
    }
  }

  function renderSuggestions() {
    if (!lastSuggestions.length) {
      hideSuggestions();
      return;
    }
    els.suggestions.innerHTML = '';
    lastSuggestions.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'suggestion' + (i === activeSuggestionIdx ? ' active' : '');
      div.textContent = s.display_name;
      div.addEventListener('click', () => pickSuggestion(s));
      els.suggestions.appendChild(div);
    });
    els.suggestions.classList.add('open');
  }

  function hideSuggestions() {
    els.suggestions.classList.remove('open');
    lastSuggestions = [];
    activeSuggestionIdx = -1;
  }

  function pickSuggestion(s) {
    userLocation = { lat: parseFloat(s.lat), lon: parseFloat(s.lon) };
    els.address.value = s.display_name;
    setCoordsInfo();
    setStatus('Location set. Click "Find restaurants".');
    hideSuggestions();
  }

  async function geocodeAddress(addr) {
    // Nominatim (OSM) — free, no key. Be polite: 1 req/sec, real UA via referer.
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addr)}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('Geocoding failed');
    const data = await res.json();
    if (!data.length) throw new Error('Address not found');
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
  }

  async function search() {
    const addrInput = els.address.value.trim();
    if (!addrInput && !userLocation) {
      setStatus('Enter an address or click "Use my location".', true);
      return;
    }
    els.searchBtn.disabled = true;
    setStatus('Locating...');

    try {
      // If we don't already have a location (from geolocation or suggestion pick), geocode the typed text.
      if (!userLocation && addrInput) {
        userLocation = await geocodeAddress(addrInput);
        setCoordsInfo();
      }

      setStatus('Searching restaurants...');
      const miles = parseFloat(els.dist.value);
      const meters = Math.round(miles * 1609.34);
      const overpassQuery = `
        [out:json][timeout:25];
        (
          node["amenity"="restaurant"](around:${meters},${userLocation.lat},${userLocation.lon});
          way["amenity"="restaurant"](around:${meters},${userLocation.lat},${userLocation.lon});
        );
        out center tags;
      `;
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: 'data=' + encodeURIComponent(overpassQuery),
      });
      if (!res.ok) throw new Error('Overpass error ' + res.status);
      const data = await res.json();

      const hiddenNames = loadHidden();
      const seen = new Set();
      restaurants = data.elements
        .map(el => {
          const tags = el.tags || {};
          const name = tags.name || tags['name:en'];
          if (!name) return null;
          const cuisine = tags.cuisine ? tags.cuisine.replace(/_/g, ' ') : '';
          const website = tags.website || tags['contact:website'] || '';
          const lat = el.lat ?? el.center?.lat;
          const lon = el.lon ?? el.center?.lon;
          return { id: el.id, name, cuisine, website, lat, lon, hidden: hiddenNames.has(name) };
        })
        .filter(r => r && !seen.has(r.name) && seen.add(r.name))
        .sort((a, b) => a.name.localeCompare(b.name));

      setStatus(`Found ${restaurants.length} restaurants within ${miles} mi.`);
      renderList();
      drawWheel();
      els.spinBtn.disabled = restaurants.length === 0;
    } catch (e) {
      setStatus('Error: ' + e.message, true);
    } finally {
      els.searchBtn.disabled = false;
    }
  }

  function renderList() {
    els.list.innerHTML = '';
    const visible = restaurants.filter(r => !r.hidden).length;
    els.count.textContent = `${visible}/${restaurants.length}`;

    restaurants.forEach((r, idx) => {
      const row = document.createElement('div');
      row.className = 'restaurant-item' + (r.hidden ? ' hidden-r' : '');
      const mapUrl = (r.lat != null && r.lon != null)
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name + ' ' + r.lat + ',' + r.lon)}`
        : '';
      row.innerHTML = `<span class="name">${escapeHtml(r.name)}</span>` +
                      (r.cuisine ? `<span class="meta">${escapeHtml(r.cuisine)}</span>` : '') +
                      (r.website ? `<a class="weblink" href="${escapeHtml(r.website)}" target="_blank" rel="noopener noreferrer">WebLink</a>` : '') +
                      (mapUrl ? `<a class="maplink" href="${escapeHtml(mapUrl)}" target="_blank" rel="noopener noreferrer">Map</a>` : '');
      row.querySelectorAll('.weblink, .maplink').forEach(a =>
        a.addEventListener('click', (e) => e.stopPropagation()));
      row.addEventListener('click', () => {
        r.hidden = !r.hidden;
        saveHidden();
        renderList();
        drawWheel();
        els.spinBtn.disabled = restaurants.filter(x => !x.hidden).length === 0;
      });
      els.list.appendChild(row);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function drawWheel(highlightAngle) {
    const ctx = els.canvas.getContext('2d');
    const size = els.canvas.width;
    const cx = size / 2, cy = size / 2;
    const radius = size / 2 - 10;

    ctx.clearRect(0, 0, size, size);

    const visible = restaurants.filter(r => !r.hidden);
    if (!visible.length) {
      ctx.fillStyle = '#8b8b9e';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('No restaurants', cx, cy);
      return;
    }

    const slice = (2 * Math.PI) / visible.length;
    const palette = ['#e94560','#f39c12','#27ae60','#3498db','#9b59b6','#1abc9c','#e67e22','#16a085'];

    visible.forEach((r, i) => {
      const start = spinAngle + i * slice - Math.PI / 2;
      const end = start + slice;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, start, end);
      ctx.fillStyle = palette[i % palette.length];
      ctx.fill();
      ctx.strokeStyle = '#16213e';
      ctx.lineWidth = 2;
      ctx.stroke();

      // label
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + slice / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      const fontSize = Math.max(10, Math.min(18, 240 / visible.length));
      ctx.font = `600 ${fontSize}px sans-serif`;
      const label = r.name.length > 22 ? r.name.slice(0, 20) + '…' : r.name;
      ctx.fillText(label, radius - 12, fontSize / 3);
      ctx.restore();
    });

    // center hub
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, 2 * Math.PI);
    ctx.fillStyle = '#16213e';
    ctx.fill();
    ctx.strokeStyle = '#e94560';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function spin() {
    if (spinning) return;
    const visible = restaurants.filter(r => !r.hidden);
    if (!visible.length) return;

    spinning = true;
    els.spinBtn.disabled = true;
    els.result.textContent = '...';

    const slice = (2 * Math.PI) / visible.length;
    const winnerIdx = Math.floor(Math.random() * visible.length);
    // Random offset inside the winning slice (±30% of slice width) so it doesn't always land dead-center
    const sliceOffset = (Math.random() - 0.5) * slice * 0.6;
    // Random WHOLE number of full revolutions (8–13). Must be integer revolutions so the final
    // landing angle = targetAngle exactly — fractional spins would offset the result.
    const fullSpins = (8 + Math.floor(Math.random() * 6)) * 2 * Math.PI;
    // Random duration: 4.0–5.4s
    const duration = 4000 + Math.random() * 1400;

    const startAngle = spinAngle % (2 * Math.PI);
    const targetAngle = -(winnerIdx + 0.5) * slice + sliceOffset;
    // Normalize so we always travel forward by fullSpins + a bit
    let delta = targetAngle - startAngle;
    delta = ((delta % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const finalAngle = startAngle + delta + fullSpins;

    const startTime = performance.now();

    // easeOutExpo — extremely fast start, long graceful slowdown
    function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }

    function frame(now) {
      const t = Math.min(1, (now - startTime) / duration);
      spinAngle = startAngle + (finalAngle - startAngle) * easeOutExpo(t);
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        els.spinBtn.disabled = false;
        els.result.textContent = '🎉 ' + visible[winnerIdx].name;
        fireConfetti();
      }
    }
    requestAnimationFrame(frame);
  }

  function fireConfetti() {
    const canvas = document.getElementById('confetti');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ['#e94560','#f39c12','#27ae60','#3498db','#9b59b6','#1abc9c','#e67e22','#ffd700','#ffffff'];
    const particles = [];
    const cx = w / 2, cy = h / 2;
    for (let i = 0; i < 120; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 9;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3, // bias upward
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 0.5,
        sw: 5 + Math.random() * 7,
        sh: 3 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1.0,
        decay: 0.006 + Math.random() * 0.006,
      });
    }
    const gravity = 0.22;
    const drag = 0.99;

    function frame() {
      ctx.clearRect(0, 0, w, h);
      let alive = false;
      for (const p of particles) {
        if (p.life <= 0) continue;
        alive = true;
        p.vy += gravity;
        p.vx *= drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        p.life -= p.decay;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.sw / 2, -p.sh / 2, p.sw, p.sh);
        ctx.restore();
      }
      if (alive) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
      }
    }
    requestAnimationFrame(frame);
  }

  // initial empty wheel + auto-request location on load
  drawWheel();
  if (navigator.geolocation) {
    useGeolocation();
  } else {
    setStatus('Geolocation unavailable — type an address.', true);
  }
</script>
</body>
</html>
